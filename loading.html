<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(#9cecff,#bdf7ff,#84e38c);
display:flex;
justify-content:center;
align-items:center;
}

/* Matahari */

.sun{
position:absolute;
top:60px;
right:80px;
width:120px;
height:120px;
background:#ffd54f;
border-radius:50%;
box-shadow:0 0 40px #ffd54f;
animation:spin 15s linear infinite;
}

.sun:before{
content:'';
position:absolute;
inset:-25px;
border-radius:50%;
background:repeating-conic-gradient(
#ffd54f 0deg 10deg,
transparent 10deg 20deg
);
z-index:-1;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* kupu */

.butterfly{
position:absolute;
font-size:50px;
animation:fly 15s linear infinite;
}

@keyframes fly{
0%{
left:-100px;
top:60%;
}
100%{
left:120%;
top:20%;
}
}

.card{
width:90%;
max-width:700px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
z-index:5;
}

h1{
color:#ff6f00;
margin-bottom:15px;
}

#timer{
font-size:40px;
font-weight:bold;
color:#6a1b9a;
margin-bottom:10px;
}

#message{
font-size:22px;
color:#2e7d32;
height:35px;
margin-bottom:20px;
}

.progress-container{
width:100%;
height:30px;
background:#ddd;
border-radius:50px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#ff9800,
#ffd54f,
#4dd0e1,
#8e24aa
);
}

#percent{
margin-top:15px;
font-size:25px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="sun"></div>
<div class="butterfly">🦋</div>

<div class="card">

<h1>🌸 Sedang Memproses Data 🌸</h1>

<div id="timer">03:00</div>

<div id="message">
Memulai proses...
</div>

<div class="progress-container">
<div class="progress" id="progress"></div>
</div>

<div id="percent">0%</div>

</div>

<script>

const data = JSON.parse(localStorage.getItem("userData"));

const messages = [
"🌱 Menyiapkan data...",
"🦋 Memverifikasi informasi...",
"🌸 Mengolah data...",
"🌿 Memeriksa kelengkapan...",
"☀️ Menyusun hasil...",
"🍀 Mengoptimalkan proses...",
"🌻 Hampir selesai...",
"✨ Finalisasi data..."
];

let msgIndex=0;

setInterval(()=>{
document.getElementById('message').innerHTML=
messages[msgIndex];

msgIndex=(msgIndex+1)%messages.length;
},5000);

let duration=180;
let current=duration;

const timer=document.getElementById('timer');
const progress=document.getElementById('progress');
const percent=document.getElementById('percent');

const countdown=setInterval(()=>{

current--;

let m=Math.floor(current/60);
let s=current%60;

timer.innerHTML=
String(m).padStart(2,'0')+
":"+
String(s).padStart(2,'0');

let done=((duration-current)/duration)*100;

progress.style.width=done+"%";

percent.innerHTML=Math.floor(done)+"%";

if(current<=0){

clearInterval(countdown);

window.location.href="success.html";

}

},1000);

</script>

<script>setTimeout(()=>location.href="qris.html",1500);</script></body>
</html>
