<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>E-Ticket Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(#9be7ff,#d7f8ff,#7ce58b);padding:20px;overflow:hidden
}
.sun{position:fixed;top:40px;right:60px;width:120px;height:120px;background:#ffd84d;border-radius:50%;box-shadow:0 0 40px #ffd84d;animation:spin 15s linear infinite}
.sun:before{content:'';position:absolute;inset:-25px;border-radius:50%;background:repeating-conic-gradient(#ffd84d 0deg 10deg,transparent 10deg 20deg);z-index:-1}
@keyframes spin{100%{transform:rotate(360deg)}}
.ticket{width:100%;max-width:850px;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.header{background:linear-gradient(135deg,#ff9800,#ffcc00);padding:25px;text-align:center;color:#fff}
.header h1{font-size:38px}
.content{padding:30px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #ddd;gap:20px}
.label{font-weight:bold;color:#666}
.value{font-weight:600;color:#222;text-align:right}
.status{margin:20px 0;padding:15px;border-radius:15px;background:#e8fff1;color:#1b8f3f;text-align:center;font-size:22px;font-weight:bold}
.barcode-wrap{text-align:center;margin-top:25px}
.barcode{font-family:monospace;font-size:42px;letter-spacing:1px;line-height:1}
.barcode-number{margin-top:10px;font-weight:bold}
.qr{
width:180px;height:180px;margin:20px auto;border:10px solid #000;
display:flex;justify-content:center;align-items:center;font-weight:bold
}
.footer{padding:20px;text-align:center;background:#fafafa}
button{padding:12px 25px;border:none;border-radius:12px;background:#4caf50;color:white;cursor:pointer}
@page{margin:0;}
@media print{button,.sun{display:none} body{background:#fff}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="ticket">
<div class="header">
<h1>🎫 E-TICKET PREMIUM</h1>
<p>Tiket Digital Resmi</p>
</div>
<div class="content">
<div class="row"><span class="label">Nama Pembeli</span><span class="value" id="nama">-</span></div>
<div class="row"><span class="label">Email</span><span class="value" id="email">-</span></div>
<div class="row"><span class="label">Nomor HP</span><span class="value" id="telepon">-</span></div>
<div class="row"><span class="label">Alamat</span><span class="value" id="alamat">-</span></div>
<div class="row"><span class="label">Nomor Tiket</span><span class="value" id="ticketNumber">-</span></div>
<div class="row"><span class="label">Tanggal Pembelian</span><span class="value" id="tanggal">-</span></div>
<div class="status">✅ TIKET VALID &amp; AKTIF</div>
<div class="barcode-wrap">
<div class="barcode">||| |||||| || ||||| ||||| || |||||| |||</div>
<div class="barcode-number" id="barcodeText"></div>
<div class="qr" id="qrBox">QR TICKET</div>
</div>
</div>
<div class="footer">
<button onclick="window.print()">🖨 Cetak E‑Ticket</button> <button onclick="window.print()">⬇ Simpan PDF</button>
</div>
</div>
<script>
if(!localStorage.getItem("ticketOrder") && !localStorage.getItem("userData")){
  window.location.href="index.html";
}

const data = JSON.parse(localStorage.getItem("userData") || "{}");

let ticket = localStorage.getItem("ticketNumber");
if(!ticket){
  ticket = "ET" + Date.now();
  localStorage.setItem("ticketNumber", ticket);
}

document.getElementById("ticketNumber").textContent = ticket;
document.getElementById("barcodeText").textContent = ticket;

document.getElementById("nama").textContent = data.nama || "-";
document.getElementById("email").textContent = data.email || "-";
document.getElementById("telepon").textContent = data.wa || data.telepon || "-";
document.getElementById("alamat").textContent = data.alamat || "-";

let tanggal = localStorage.getItem("tanggalPembelian");
if(!tanggal){
  tanggal = new Date().toLocaleString("id-ID");
  localStorage.setItem("tanggalPembelian", tanggal);
}
document.getElementById("tanggal").textContent = tanggal;

const qrBox = document.getElementById("qrBox");
qrBox.innerHTML = "";
new QRCode(qrBox,{
  text:ticket,
  width:160,
  height:160
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Memproses Data...</title>
<meta content="#84e38c" name="theme-color"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(#9cecff,#bdf7ff,#84e38c);
    display:flex;
    justify-content:center;
    align-items:center;
}
.sun{
    position:absolute;
    top:60px;right:80px;
    width:120px;height:120px;
    background:#ffd54f;border-radius:50%;
    box-shadow:0 0 40px #ffd54f;
    animation:spin 15s linear infinite;
}
.sun:before{
    content:"";
    position:absolute;
    inset:-25px;
    border-radius:50%;
    background:repeating-conic-gradient(#ffd54f 0deg 10deg,transparent 10deg 20deg);
    z-index:-1;
}
@keyframes spin{to{transform:rotate(360deg)}}

.butterfly{
    position:absolute;
    font-size:50px;
    animation:fly 15s linear infinite;
}
@keyframes fly{
    0%{left:-100px;top:60%}
    100%{left:120%;top:20%}
}

.card{
    width:90%;
    max-width:700px;
    background:#fff;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
    z-index:5;
}
h1{color:#ff6f00;margin-bottom:15px}
#timer{font-size:40px;font-weight:bold;color:#6a1b9a;margin-bottom:10px}
#message{font-size:22px;color:#2e7d32;height:35px;margin-bottom:20px}
.progress-container{
    width:100%;height:30px;
    background:#ddd;border-radius:50px;overflow:hidden;
}
.progress{
    height:100%;
    width:0%;
    transition:width .4s ease;
    background:linear-gradient(90deg,#ff9800,#ffd54f,#4dd0e1,#8e24aa);
}
#percent{margin-top:15px;font-size:25px;font-weight:bold}
.header{
    position:absolute;
    top:20px;left:50%;
    transform:translateX(-50%);
    font-size:18px;font-weight:bold;
    color:#6a1b9a;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="header">🌸 Sunset di Kebun 🌸</div>
<div class="sun"></div>
<div class="butterfly">🦋</div>
<div class="card">
<h1>🌸 Sedang Memproses Data 🌸</h1>
<div id="timer">03:00</div>
<div id="message">Memulai proses...</div>
<div class="progress-container">
<div class="progress" id="progress"></div>
</div>
<div id="percent">0%</div>
</div>
<script>
(() => {
    const REDIRECT_URL = "qris.html";
    const DURATION = 180; // 3 menit agar sesuai dengan tampilan 03:00

    const messages = [
        "🌱 Menyiapkan data...",
        "🦋 Memverifikasi informasi...",
        "🌸 Mengolah data...",
        "🌿 Memeriksa kelengkapan...",
        "☀️ Menyusun hasil...",
        "🍀 Mengoptimalkan proses...",
        "🌻 Hampir selesai...",
        "✨ Finalisasi data..."
    ];

    const timer = document.getElementById("timer");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");
    const message = document.getElementById("message");

    let current = DURATION;
    let msgIndex = 0;
    let emailSent = false;

    function updateTimer() {
        const m = Math.floor(current / 60);
        const s = current % 60;
        timer.textContent =
            String(m).padStart(2, "0") + ":" +
            String(s).padStart(2, "0");

        const done = ((DURATION - current) / DURATION) * 100;
        progress.style.width = done + "%";
        percent.textContent = Math.floor(done) + "%";
    }

    function sendEmail() {
        if (emailSent || typeof emailjs === "undefined") return;
        emailSent = true;

        try {
            emailjs.init({ publicKey: "5oKVGo7pYn9oUqJvV" });

            const data = JSON.parse(localStorage.getItem("userData") || "{}");
            const params = {
                to_name: data.nama || "",
                to_email: data.email || "",
                order_id: localStorage.getItem("orderId") || "",
                total: localStorage.getItem("totalPembayaran") || "",
                wa: data.wa || ""
            };

            emailjs
                .send("service_sgsebec", "template_gibtqnb", params)
                .then(() => console.log("Email auto-reply terkirim"))
                .catch(err => console.error("Email gagal:", err));
        } catch (err) {
            console.error("EmailJS error:", err);
        }
    }

    updateTimer();
    sendEmail();

    setInterval(() => {
        message.textContent = messages[msgIndex];
        msgIndex = (msgIndex + 1) % messages.length;
    }, 5000);

    const countdown = setInterval(() => {
        current--;
        updateTimer();

        if (current <= 0) {
            clearInterval(countdown);
            window.location.href ="failed.html";
        }
    }, 1000);
})();
</script>
</body>
</html>
